site_name: Chili Creator docs
site_description: The Chili Creator is a collection of game editors. Make Bitsy and Chili Beat games, release them on Chili Platform and play them on VGC Zero.
site_url: https://creator.chilichip.eu/
repo_url: https://github.com/chili-chip/chili-creator
repo_name: chili-chip/chili-creator
edit_uri: edit/main/docs/
copyright: >
  Chili Creator is MIT licensed. Bitsy is by Adam Le Doux and the
  <a href="https://creator.chilichip.eu/reference/credits/">Bitsy contributors</a>.

exclude_docs: |
  /requirements.txt
  /bitsy/

theme:
  name: material
  logo: assets/chili.svg
  favicon: assets/chili.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/xB9sPYKBZc
      name: chilichip on Discord
    - icon: fontawesome/brands/github
      link: https://github.com/chili-chip
      name: chili-chip on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true


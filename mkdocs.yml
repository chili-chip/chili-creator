          - 2. Avatar and sprites: editors/bitsy/tutorial/2-avatar-and-sprites.md
          - 3. Items: editors/bitsy/tutorial/3-items.md
          - 4. Dialog: editors/bitsy/tutorial/4-dialog.md
          - 5. Exits and endings: editors/bitsy/tutorial/5-exits-and-endings.md
          - 6. Variables: editors/bitsy/tutorial/6-variables.md
          - 7. Test and release: editors/bitsy/tutorial/7-test-and-release.md
      - Tools:

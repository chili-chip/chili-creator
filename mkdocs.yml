          - Paint: editors/bitsy/tools/paint.md
          - Library: editors/bitsy/tools/library.md
          - Colors: editors/bitsy/tools/colors.md
          - Dialog: editors/bitsy/tools/dialog.md
          - Exits & endings: editors/bitsy/tools/exits.md
          - Variables: editors/bitsy/tools/variables.md
          - Tunes: editors/bitsy/tools/tunes.md
          - Blips: editors/bitsy/tools/blips.md
          - Problems: editors/bitsy/tools/problems.md
          - Play: editors/bitsy/tools/play.md
          - Game: editors/bitsy/tools/game.md

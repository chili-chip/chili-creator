# Tests and builds the creator (app/) on
# every pull request and push.
# A push to main whose package.json version has no tag yet tags it (v0.2.1)
# and publishes a GitHub release; a tag pushed by hand publishes one too.
# The platform picks a release up by pinning that tag in its package.json.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ['v*']

# Jobs only read the repository unless they say otherwise (release, tag).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  # Line coverage of the unit tests, for information only: the target is 80%
  # (AGENTS.md), and a lower number never fails this job or blocks the PR.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TARGET: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:coverage
      - name: Report coverage (target 80%, information only)
        if: always()
        run: |
          total=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          {
            echo "## Code coverage: ${total}% of lines (target ${TARGET}%)"
            echo
            echo "Information only: this check never blocks a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
          if node -e "process.exit(${total} >= ${TARGET} ? 0 : 1)"; then
            echo "::notice title=Code coverage::${total}% of lines (target ${TARGET}%)"
          else
            echo "::warning title=Code coverage below target::${total}% of lines, target ${TARGET}%. Information only, not blocking."
          fi

  # Playwright against the production build, including the creator inside a
  # stand-in for the platform page (e2e/fake-platform.ts).
  # Runs in Playwright's own image, pinned to the @playwright/test version in
  # package.json: the browsers are already there, whatever Ubuntu the runner has.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" chili-chip-creator-*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Tags created with the workflow token do not start other workflows, so
  # this job publishes the release itself instead of leaving it to `release`.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tag and release a new version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists, nothing to release."
            exit 0
          fi
          npm ci && npm run build
          npm pack
          gh release create "$tag" chili-chip-creator-*.tgz --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

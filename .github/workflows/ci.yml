# Checks the editor on every pull request and push.
# A pushed tag like v0.2.0 also publishes a GitHub release; the platform
# picks a release up by pinning that tag in its package.json.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" chili-chip-creator-*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

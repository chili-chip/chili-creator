# Build the docs with MkDocs, then deploy them to Cloudflare Pages with Direct Upload
# (https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/).
#
#   push to main     -> chili-creator-docs production (https://creator.chilichip.eu)
#   pull request     -> chili-creator-docs preview for the PR branch (link in the PR's deployments)
#
# The Cloudflare deploy is skipped until the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist.
name: Docs

on:
  push:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request or for main; a pull request never cancels a main deploy
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # --strict fails on broken links and pages missing from the nav
      - run: mkdocs build --strict

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

  deploy-cloudflare:
    needs: build
    # Fork PRs get no secrets, so only deploy main and same-repo PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Cloudflare secrets are not set; skipping the Cloudflare deploy."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=chili-creator-docs --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
